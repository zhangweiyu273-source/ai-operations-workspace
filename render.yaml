services:
  - type: pserv
    name: ai-ops-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: alembic upgrade head
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ops-db
          property: connectionString
      - key: DEFAULT_ORGANIZATION_ID
        value: 00000000-0000-4000-8000-000000000001
      - key: CORS_ORIGINS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_TIMEOUT
        value: "30"
      - key: AI_MAX_RETRIES
        value: "2"

  - type: web
    name: ai-ops-workbench
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: BACKEND_HOSTPORT
        fromService:
          type: pserv
          name: ai-ops-api
          property: hostport
      - key: ACCESS_PROTECTION_ENABLED
        value: "true"
      - key: ADMIN_ACCESS_PASSWORD
        sync: false
      - key: VIEWER_ACCESS_PASSWORD
        sync: false

databases:
  - name: ai-ops-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
